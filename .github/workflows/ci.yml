name: QA Automation CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit tests
        run: >
          mvn -B
          -Dtest=ConfigReaderTest,SimularQuitacaoBuilderTest,SimularQuitacaoServiceTest,BoletoQuitacaoValidatorTest
          test